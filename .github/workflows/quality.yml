name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang \
            clang-format \
            clang-tidy \
            cmake \
            include-what-you-use \
            ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++
      - name: Check formatting
        run: clang-format --dry-run --Werror ufcs.hpp
      - name: Run clang-tidy and IWYU
        run: cmake --build build --target clang-tidy include-what-you-use
